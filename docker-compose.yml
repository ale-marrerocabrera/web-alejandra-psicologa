services:
  frontend:
    build:
      context: .
      target: production
      args:
        # La API se sirve bajo el mismo dominio mediante el Nginx del servidor.
        VITE_API_URL: ""
    ports:
      # Solo el Nginx del servidor debe poder acceder al contenedor.
      - "127.0.0.1:3000:80"
    restart: unless-stopped
