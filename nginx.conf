server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The administration area is client-side routed, so direct visits and
  # refreshes under /admin must return the React entry point too.
  location ^~ /admin/ {
    try_files $uri $uri/ /index.html;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
